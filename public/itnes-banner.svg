      <stop offset="0" stop-color="#1447c8"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1090" cy="40" r="170" fill="#fff" opacity=".07"/>
  <circle cx="1010" cy="290" r="120" fill="#fff" opacity=".07"/>

